<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FitCasino — Лобби</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">FC</div>
      <div class="brand-name">Fit<em>Casino</em></div>
    </div>
    <div class="wallet-chip"><span class="coin"></span><span class="val">0</span></div>
  </div>

  <div class="scroll-x" id="filterRow">
    <button class="filter-chip active" data-f="all">Все</button>
    <button class="filter-chip" data-f="hit">Хиты</button>
    <button class="filter-chip" data-f="new">Новинки</button>
    <button class="filter-chip" data-f="tumble">Каскадные</button>
  </div>

  <div class="section-title"><h2>Слоты</h2><span id="countLbl"></span></div>
  <div class="slot-grid" id="slotGrid"></div>

  <div style="flex:1"></div>
  <div id="navSlot"></div>
</div>

<div id="toast" class="toast"></div>

<script src="js/db.js"></script>
<script src="js/app-common.js"></script>
<script src="js/slots-config.js"></script>
<script src="js/symbols.js"></script>
<script src="js/lobby.js"></script>
</body>
</html>
